<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="./images/grape.ico">
    <title>Master WebGIS</title>
  </head>
  <body>
    <header>
        <!-- Header Buttons zum öffnen verschiedener Elemente -->
        <button id="toggleSidebar" class="toggle-btn">☰</button>
    </header>
    <main>
        
        <!-- Karten-Element -->
      <div class="top-buttons">
        <button id="btnLayerList">Layers</button>
        <button id="edit1" class="draw-btn">Edit</button>
      </div>

      <aside id="layerListSidebar">
        <h2>Layer List</h2>
        <ul id="layerList"></ul>
        <button id="closelayerList">X</button>
      </aside>
      <div id="popup" class="ol-popup">
        <a href="#" id="popup-closer" class="ol-popup-closer"></a>
        <div id="popup-content"></div>
      </div>
      <div id="map" class="map"></div>

    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
